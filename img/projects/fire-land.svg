<svg xmlns="http://www.w3.org/2000/svg" width="370" height="189" viewBox="0 0 370 189">
  <defs>
    <linearGradient id="flbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#241539"/>
      <stop offset="55%" style="stop-color:#3a1836"/>
      <stop offset="100%" style="stop-color:#b23a1e"/>
    </linearGradient>
    <radialGradient id="flflame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff3c4"/>
      <stop offset="45%" style="stop-color:#ffb300"/>
      <stop offset="100%" style="stop-color:#ff5722;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="370" height="189" fill="url(#flbg)" rx="8"/>

  <!-- suelo -->
  <rect x="0" y="150" width="370" height="39" fill="#2a1a12"/>
  <line x1="0" y1="150" x2="370" y2="150" stroke="#ff7a3d" stroke-width="2"/>

  <!-- brasas -->
  <g fill="#ffb35a" opacity="0.7">
    <rect x="60" y="40" width="3" height="3"/>
    <rect x="130" y="70" width="3" height="3"/>
    <rect x="210" y="30" width="3" height="3"/>
    <rect x="300" y="90" width="3" height="3"/>
    <rect x="340" y="55" width="3" height="3"/>
  </g>

  <!-- pistola de fuego -->
  <g transform="translate(58,110)">
    <rect x="-18" y="-12" width="24" height="24" rx="5" fill="#37474f"/>
    <rect x="2" y="-6" width="26" height="12" fill="#546e7a"/>
    <rect x="-14" y="8" width="10" height="16" fill="#263238"/>
    <circle cx="34" cy="0" r="20" fill="url(#flflame)"/>
  </g>

  <!-- bola de fuego -->
  <circle cx="170" cy="110" r="12" fill="url(#flflame)"/>
  <circle cx="170" cy="110" r="5" fill="#fff"/>

  <!-- robots -->
  <g fill="#90a4ae">
    <rect x="250" y="118" width="34" height="30" rx="5"/>
    <rect x="256" y="126" width="22" height="6" fill="#ff1744"/>
    <rect x="253" y="146" width="6" height="8" fill="#455a64"/>
    <rect x="275" y="146" width="6" height="8" fill="#455a64"/>
  </g>
  <g fill="#90a4ae">
    <circle cx="315" cy="60" r="15"/>
    <circle cx="315" cy="60" r="6" fill="#ff1744"/>
    <line x1="298" y1="43" x2="332" y2="43" stroke="#cfd8dc" stroke-width="3"/>
  </g>

  <text x="185" y="176"
        font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold"
        fill="#ffca8a" text-anchor="middle" letter-spacing="2">
    FIRE LAND
  </text>
</svg>
